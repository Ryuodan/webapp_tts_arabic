<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic TTS Studio — Request log</title>
  <link rel="stylesheet" href="style.css?v=18">
  <link rel="stylesheet" href="logs.css?v=1">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">📊</div>
      <div class="brand-text">
        <span class="brand-en">Arabic TTS Studio — Request log</span>
        <span class="brand-ar" data-i18n="logs.tagline">سجل الطلبات والاستخدام</span>
      </div>
    </div>
    <div class="status-row">
      <button class="lang-toggle" id="lang-toggle" type="button"
              data-i18n="lang.toggle" data-i18n-title="lang.toggleTitle">EN</button>
      <a class="api-link" href="api.html" data-i18n="nav.api">‹/› واجهة الـ API</a>
      <a class="api-link" href="index.html" data-i18n="nav.studio">🎙 عودة إلى الاستوديو</a>
    </div>
  </header>

  <main class="logs-page">
    <p class="logs-intro" data-i18n="logs.intro">
      كل نداء على ‎/api/‎ يُسجَّل هنا: ما أُرسل، وما رجع، وكم استغرق.
    </p>

    <!-- Window + global actions -->
    <div class="logs-toolbar">
      <span class="logs-toolbar-label" data-i18n="logs.window">المدة</span>
      <div class="logs-windows" id="logs-windows">
        <button type="button" data-hours="1"   data-i18n="logs.win1h">ساعة</button>
        <button type="button" data-hours="24"  data-i18n="logs.win24h" class="on">٢٤ ساعة</button>
        <button type="button" data-hours="168" data-i18n="logs.win7d">٧ أيام</button>
        <button type="button" data-hours="0"   data-i18n="logs.winAll">الكل</button>
      </div>
      <button type="button" class="btn-ghost btn-xs" id="logs-refresh" data-i18n="logs.refresh">↻ تحديث</button>
      <label class="logs-auto">
        <input type="checkbox" id="logs-auto">
        <span data-i18n="logs.auto">تحديث تلقائي</span>
      </label>
      <span class="logs-stored" id="logs-stored"></span>
      <button type="button" class="btn-ghost btn-xs logs-danger" id="logs-clear" data-i18n="logs.clear">مسح السجل</button>
    </div>

    <div class="logs-banner" id="logs-banner" hidden></div>

    <!-- Headline numbers for the window -->
    <div class="logs-tiles" id="logs-tiles"></div>

    <!-- Volume over time -->
    <section class="logs-panel">
      <h3 class="logs-panel-title" data-i18n="logs.timeline">الطلبات عبر الزمن</h3>
      <div class="logs-timeline" id="logs-timeline"></div>
    </section>

    <!-- Per-endpoint breakdown -->
    <section class="logs-panel">
      <h3 class="logs-panel-title" data-i18n="logs.endpoints">حسب نقطة النهاية</h3>
      <div class="logs-table-wrap">
        <table class="logs-table" id="logs-endpoints"></table>
      </div>
    </section>

    <!-- The requests themselves -->
    <section class="logs-panel">
      <h3 class="logs-panel-title" data-i18n="logs.requests">الطلبات</h3>
      <div class="logs-filters">
        <select id="logs-route"></select>
        <select id="logs-status">
          <option value="" data-i18n="logs.statusAll">كل الحالات</option>
          <option value="ok" data-i18n="logs.statusOk">ناجحة فقط</option>
          <option value="error" data-i18n="logs.statusErr">أخطاء فقط</option>
        </select>
        <input type="search" id="logs-q" dir="auto" data-i18n-placeholder="logs.searchPh">
        <span class="logs-count" id="logs-count"></span>
      </div>
      <div class="logs-rows" id="logs-rows"></div>
      <button type="button" class="btn-ghost btn-xs logs-more" id="logs-more" hidden></button>
    </section>
  </main>

  <script src="i18n.js?v=2"></script>
  <script src="logs.js?v=1"></script>
</body>
</html>
