<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic TTS Studio — API</title>
  <link rel="stylesheet" href="style.css?v=18">
  <link rel="stylesheet" href="api.css?v=3">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">‹/›</div>
      <div class="brand-text">
        <span class="brand-en">Arabic TTS Studio — API</span>
        <span class="brand-ar" data-i18n="api.tagline">واجهة برمجية مفتوحة: تفريغ صوتي وتوليد كلام</span>
      </div>
    </div>
    <div class="status-row">
      <button class="lang-toggle" id="lang-toggle" type="button"
              data-i18n="lang.toggle" data-i18n-title="lang.toggleTitle">EN</button>
      <a class="api-link" href="index.html" data-i18n="nav.studio">🎙 عودة إلى الاستوديو</a>
    </div>
  </header>

  <main class="api-page">
    <p class="api-intro">
      <span data-i18n="api.intro1">كل نقطة نهاية أدناه قابلة للتجربة مباشرة من هذه الصفحة، ومعها أمر curl جاهز للنسخ.</span>
      <span data-i18n="api.intro2">الخادم هو نفسه الذي يخدم هذه الصفحة، لذا تعمل المسارات النسبية كما هي من أي عميل على الشبكة.</span>
    </p>
    <div class="api-base">
      <span data-i18n="api.base">عنوان الخدمة</span>
      <code id="api-base">—</code>
    </div>

    <div class="api-list" id="api-list">
      <!-- endpoint cards rendered by api.js -->
    </div>
  </main>

  <script src="i18n.js?v=1"></script>
  <script src="recorder.js?v=1"></script>
  <script src="api.js?v=5"></script>
</body>
</html>
