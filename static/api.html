<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic TTS Studio — API</title>
  <link rel="stylesheet" href="style.css?v=12">

<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">‹/›</div>

        <span class="brand-en">Arabic TTS Studio — API</span>
        <span class="brand-ar">واجهة برمجية مفتوحة: تفريغ صوتي وتوليد كلام</span>
      </div>
    </div>
    <div class="status-row">
      <a class="api-link" href="index.html">🎙 عودة إلى الاستوديو</a>

  <main class="api-page">
    <p class="api-intro">

    </p>
    <div class="api-base">
      <span>عنوان الخدمة</span>
      <code id="api-base">—</code>
    </div>

    <div class="api-list" id="api-list">
      <!-- endpoint cards rendered by api.js -->
